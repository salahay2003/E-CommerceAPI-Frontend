<div class="card bg-gray-100 w-auto shadow-md">
  <figure class="h-64 bg-white">
  <img
    src="{{ product().imageUrl }}"
    alt="{{ product().name }}"
    class="w-full h-full object-contain"
  />
</figure>
  <div class="card-body">
    <h2 class="card-title">{{ product().name }}</h2>
    <p>{{ product().description }}</p>
    <div class="card-actions justify-end items-center">
      <button class="btn bg-green-700 text-white" (click)="addToCart()">Add to cart</button>
      <p class="card-sm">${{ product().price.toFixed(2) }}</p>
    </div>
  </div>

  <!-- Success Alert -->
  <div *ngIf="showAlert()" class="fixed top-4 right-4 bg-white inline-flex space-x-3 p-3 text-sm rounded border border-gray-200 shadow-lg">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16.5 8.31V9a7.5 7.5 0 1 1-4.447-6.855M16.5 3 9 10.508l-2.25-2.25" stroke="#22C55E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <h3 class="text-slate-700 font-medium">Successfully saved!</h3>
      <p class="text-slate-500">Added to cart successfully.</p>
    </div>
    <button type="button" (click)="closeAlert()" aria-label="close" class="cursor-pointer mb-auto text-slate-400 hover:text-slate-600 active:scale-95 transition">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect y="12.532" width="17.498" height="2.1" rx="1.05" transform="rotate(-45.74 0 12.532)" fill="currentColor" fill-opacity=".7"/>
        <rect x="12.531" y="13.914" width="17.498" height="2.1" rx="1.05" transform="rotate(-135.74 12.531 13.914)" fill="currentColor" fill-opacity=".7"/>
      </svg>
    </button>
  </div>
</div>
